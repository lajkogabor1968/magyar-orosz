"use strict";
const DATA=[{"title":"Megváltozott a terv","ru":"Планы изменились","no":15,"paragraphs":["Irina és a barátai szombaton kerékpártúrát terveztek a tó körül. Már megbeszélték, hogy reggel kilenckor találkoznak. Pénteken azonban megnézték az időjárás-előrejelzést. Délelőtt erős szél várható, délután pedig zivatar lehet. Irina nem szeretné lemondani az egész programot.","Azt javasolja, hogy inkább vasárnap menjenek biciklizni. Szombatra keres egy másik lehetőséget: a városi múzeumban új kiállítás nyílt. Két barátja ráér, a harmadik csak délután tud csatlakozni. Végül úgy döntenek, hogy először együtt ebédelnek, utána pedig megnézik a kiállítást. A túra vasárnapra marad."],"words":[["kerékpártúra","велосипедная прогулка"],["tervez","планировать"],["megbeszél","обсуждать, договариваться"],["azonban","однако"],["időjárás-előrejelzés","прогноз погоды"],["délelőtt","до полудня"],["erős szél","сильный ветер"],["várható","ожидается"],["zivatar","гроза"],["lemond egy programot","отменять мероприятие"],["javasol","предлагать"],["inkább","лучше, скорее"],["lehetőség","возможность"],["kiállítás nyílik","открывается выставка"],["ráér","быть свободным, иметь время"],["csatlakozik","присоединяться"],["végül","в конце концов"],["úgy dönt","решать"],["vasárnapra marad","откладывается до воскресенья"]],"dialogue":"– Láttad az előrejelzést?\n – Igen, úgy néz ki, hogy esni fog.\n – Mi lenne, ha vasárnap mennénk?\n – Nekem jó, de szombaton is szeretnék találkozni.\n – Akkor menjünk el a múzeumba!\n – Rendben. Szólok a többieknek.","notice":"Minta-előrejelzés\n\n  Szombat: 12–17 °C, délelőtt erős szél, 15 órától zivatar lehetséges. Vasárnap: 14–20 °C,\n  napos, gyenge szél. A szabadtéri programokhoz vasárnap kedvezőbb az idő.","grammar":"7. Nyelvtan • Грамматика: Javaslat: mi lenne, ha…?\nMi lenne, ha elhalasztanánk a túrát? — Что, если мы отложим поездку? После ha в таких\n предложениях используется условное наклонение: mennénk, találkoznánk. Простой\n вариант: Menjünk inkább vasárnap! — Давайте лучше пойдём в воскресенье. A jövő\n kifejezhető a fog igével: Esni fog. — Будет дождь.","phrases":"Magyar                                           Русский\n\n  Úgy néz ki, hogy esni fog.                       Похоже, будет дождь.\n  Mi lenne, ha holnap mennénk?                     Что, если мы пойдём завтра?\n  Inkább tegyük át vasárnapra!                     Лучше перенесём на воскресенье!\n  Nekem mindkét nap megfelel.                      Мне подходят оба дня.\n  Szólok, ha változik a terv.                      Я сообщу, если планы изменятся.","read":"1. Miért változtatnak a terven?\n\n\n 2. Hová mennek szombaton?\n\n\n 3. Az előrejelzés szerint melyik nap jobb a túrához?","readAns":"1. Az erős szél és a zivatar miatt. | 2. A múzeumba. | 3. Vasárnap.","fill":"1. Mi lenne, ha vasárnap ___? (megy, mi)\n 2. Holnap esni ___.\n 3. Inkább ___ át a programot! (tesz, mi, felszólítás)","grammarAns":"1. mennénk | 2. fog | 3. tegyük","translate":"1. Похоже, будет дождь.\n\n\n 2. Лучше перенесём встречу на воскресенье.","transAns":"1. Úgy néz ki, hogy esni fog. | 2. Inkább tegyük át a találkozót vasárnapra!","listen":"1. Miért halasztják el?\n\n\n 2. Mikor és hol találkoznak?","audio":"A holnapi pikniket elhalasztjuk. Délután eső várható. Vasárnap tíz órakor találkozunk a park bejáratánál. Kérlek, hozzatok innivalót!","listenAns":"1. Eső várható. | 2. Vasárnap tízkor, a park bejáratánál.","role":"A: Csak szombaton érsz rá. B: Vasárnap szeretnél kirándulni, de szombaton rossz az idő.\n Találjatok közös programot, és egyezzetek meg a helyben és időpontban.","write":"Írj 5–7 mondatos csoportüzenetet: miért változik a program, milyen két lehetőség van, és\n mikor találkoztok."},{"title":"Egy hétvége vidéken","ru":"Выходные за городом","no":16,"paragraphs":["Andrej a feleségével két éjszakát szeretne eltölteni egy kisvárosban. Nem drága szállodát keresnek, hanem csendes apartmant. Fontos nekik, hogy legyen saját konyha, és a közelben lehessen sétálni. Két ajánlatot találnak. Az első olcsóbb, de a város szélén van.","A második közelebb van a központhoz, viszont fizetni kell a parkolásért. Andrej felhívja a szállásadót, mert csak este hét után tudnak megérkezni. Megkérdezi, hogyan vehetik át a kulcsot. A szállásadó azt mondja, hogy késői érkezés is lehetséges, ha előre jelzik. Andrej még a lemondási feltételeket is megkérdezi, mielőtt foglal."],"words":[["eltölt két éjszakát","проводить две ночи"],["kisváros","небольшой город"],["szálloda","гостиница"],["csendes apartman","тихие апартаменты"],["saját konyha","собственная кухня"],["a közelben","поблизости"],["ajánlat","предложение"],["olcsóbb","дешевле"],["a város szélén","на окраине города"],["központ","центр"],["viszont","зато, однако"],["parkolás","парковка"],["szállásadó","хозяин жилья"],["megérkezik","прибывать"],["átveszi a kulcsot","получать ключ"],["késői érkezés","позднее прибытие"],["előre jelez","сообщать заранее"],["lemondási feltételek","условия отмены бронирования"],["foglal","бронировать"]],"dialogue":"– Jó napot! Két éjszakára szeretnék szállást foglalni.\n – Melyik napra tervezi az érkezést?\n – Péntekre, de csak este nyolc körül érünk oda.\n – Semmi gond, előre egyeztetjük a kulcsátadást.\n – Van lehetőség ingyenesen lemondani?\n – Az ajánlatban szerepelnek a feltételek. Elküldöm e-mailben.","notice":"Két elképzelt ajánlat\n\n  A: Kert Apartman — 24 000 Ft/éj, saját konyha, ingyenes parkolás, a központtól 3 km. B:\n  Főtér Vendégház — 28 000 Ft/éj, saját konyha, parkolás 2000 Ft/nap, a központban.","grammar":"7. Nyelvtan • Грамматика: Összehasonlítás: -bb, mint\nOlcsó — olcsóbb, drága — drágább, közel — közelebb. При сравнении используется\n суффикс -bb: Az apartman olcsóbb, mint a vendégház. — Апартаменты дешевле, чем\n гостевой дом. A központhoz közelebb van. — Находится ближе к центру. A legolcsóbb —\n самый дешёвый.","phrases":"Magyar                                           Русский\n\n  Van még szabad szobájuk?                         У вас ещё есть свободные номера?\n  Két főre foglalnék.                              Я хотел(а) бы забронировать на двоих.\n  Később érkezünk a tervezettnél.                  Мы приедем позже, чем планировали.\n  Benne van a reggeli az árban?                    Завтрак входит в стоимость?\n  Meddig mondhatom le a foglalást?                 До какого срока я могу отменить бронирование?","read":"1. Milyen szállást keresnek Andrejék?\n\n\n 2. Miért telefonál Andrej?\n\n\n 3. Melyik ajánlat olcsóbb egy éjszakára parkolási díj nélkül is?","readAns":"1. Csendes apartmant, saját konyhával. | 2. Későn érkeznek, és a kulcsátadásról érdeklődik. | 3. Az A ajánlat.","fill":"1. Ez a szoba ___, mint a másik. (tágas)\n 2. A vendégház ___ van a központhoz. (közel)\n 3. Ez a ___ szállás. (olcsó, felsőfok)","grammarAns":"1. tágasabb | 2. közelebb | 3. legolcsóbb","translate":"1. Я хотел(а) бы забронировать на двоих.\n\n\n 2. Мы приедем позже, чем планировали.","transAns":"1. Két főre szeretnék foglalni. | 2. Később érkezünk a tervezettnél.","listen":"1. Mikortól lehet elfoglalni a szobát?\n\n\n 2. Mi ingyenes?","audio":"A szobát pénteken délután háromtól lehet elfoglalni. Vasárnap tízig kell elhagyni. A reggelit külön lehet kérni, a parkolás ingyenes.","listenAns":"1. Péntek délután háromtól. | 2. A parkolás.","role":"Páros döntés: egyikőtök autóval érkezik és takarékoskodna, másikótok a központban\n szeretne lakni. Válasszatok az A és B ajánlatból, majd telefonon kérdezzetek rá három\n feltételre.","write":"Írj szállásadónak egy rövid e-mailt két főre, két éjszakára, késői érkezéssel. Kérdezz rá a\n parkolásra és a lemondásra."},{"title":"Mit nézzünk meg?","ru":"Куда пойдём?","no":17,"paragraphs":["Marina és Pavel szeretnének péntek este kikapcsolódni. Marina szívesen menne koncertre, Pavel inkább filmet nézne. A városi programajánlóban három érdekes eseményt találnak. A koncert későn kezdődik, és másnap korán kell kelniük. A moziban egy magyar vígjátékot vetítenek, amelyhez van magyar felirat.","Pavel szerint ez jó lehetőség a nyelvgyakorlásra. Marina attól tart, hogy nem fog mindent érteni. Végül megegyeznek: most moziba mennek, a következő héten pedig koncertre. A jegyeket előre megveszik, mert egymás mellett szeretnének ülni. A film után megbeszélik, melyik jelenet tetszett nekik a legjobban."],"words":[["kikapcsolódik","отдыхать, отвлекаться от дел"],["szívesen","с удовольствием"],["inkább","предпочтительнее, лучше"],["programajánló","афиша мероприятий"],["esemény","мероприятие"],["másnap","на следующий день"],["korán kel","рано вставать"],["vígjáték","комедия"],["vetít","показывать фильм"],["felirat","субтитры"],["lehetőség","возможность"],["nyelvgyakorlás","языковая практика"],["attól tart, hogy…","опасаться, что…"],["megegyezik","договариваться"],["következő hét","следующая неделя"],["jegyet vesz","покупать билет"],["előre","заранее"],["egymás mellett","рядом друг с другом"],["jelenet","сцена"]],"dialogue":"– Jó estét! Két jegyet szeretnénk a hétórás előadásra.\n – Középre vagy a hátsó sorba szeretnének ülni?\n – Inkább középre. Van két hely egymás mellett?\n – Igen, a hatodik sorban.\n – Remek, azokat kérjük.\n – Tessék, jó szórakozást!","notice":"Pénteki programok\n\n  Mozi: magyar vígjáték, 19.00, 2400 Ft, magyar felirat. Koncert: élő zene, 21.00, 4500 Ft.\n  Kiállítás: fotók a városról, 16–18 óra, 1500 Ft. Mintaárak.","grammar":"7. Nyelvtan • Грамматика: Vélemény és indoklás\nSzerintem a film érdekes. — По-моему, фильм интересный. Nekem tetszik a film. — Мне\n нравится фильм. A tetszik mellett az, akinek tetszik valami: nekem, neked, neki. Для\n объяснения причины: mert — потому что. Inkább moziba mennék, mert korán kezdődik a\n film.","phrases":"Magyar                                           Русский\n\n  Mihez lenne kedved?                              Чем бы ты хотел(а) заняться?\n  Szerintem ez jó választás.                       По-моему, это хороший выбор.\n  Nekem az első tetszik jobban.                    Мне первый вариант нравится больше.\n  Van két hely egymás mellett?                     Есть два места рядом?\n  Megérte eljönni.                                 Стоило прийти.","read":"1. Miért nem választják most a koncertet?\n\n\n 2. Miért jó a magyar felirat Pavel szerint?\n\n\n 3. Hol kapnak helyet a párbeszédben?","readAns":"1. Későn kezdődik, és másnap korán kelnek. | 2. Lehet nyelvet gyakorolni. | 3. A hatodik sorban.","fill":"1. ___ tetszik ez a film. (én)\n 2. Inkább moziba mennék, ___ fáradt vagyok.\n 3. Nekem a koncert tetszik ___. (jobban/jobb)","grammarAns":"1. Nekem | 2. mert | 3. jobban","translate":"1. По-моему, это хороший выбор.\n\n\n 2. Есть два места рядом?","transAns":"1. Szerintem ez jó választás. | 2. Van két hely egymás mellett?","listen":"1. Miért marad el az előadás?\n\n\n 2. Mikorra használhatók fel a jegyek?","audio":"A ma esti előadás elmarad, mert az egyik szereplő megbetegedett. A jegyeket a jövő pénteki előadásra lehet felhasználni. Ha az időpont nem jó, kérjük, keresse a jegypénztárt.","listenAns":"1. Egy szereplő megbetegedett. | 2. A jövő pénteki előadásra.","role":"Válasszatok a három programból! Fejenként legfeljebb 3000 forintotok van, és este nyolc\n előtt haza kell érnetek. Beszéljétek meg, mit lehet választani, milyen további információ\n kellene.","write":"Ajánlj egy filmet, koncertet vagy könyvet egy barátodnak 5–7 mondatban! Mondd el, miről\n szól, mi tetszett benne, és kinek ajánlod."},{"title":"Próbáljunk ki valami újat!","ru":"Попробуем что-нибудь новое!","no":18,"paragraphs":["Szonja sokat ül a munkahelyén, ezért szeretne többet mozogni. Régóta gondolkodik azon, hogy úszni járjon vagy kipróbáljon egy csoportos tornát. Egy ismerőse kezdő jógaórát ajánl neki. Szonja még soha nem jógázott, ezért először próbaórára jelentkezik. Megkérdezi, kell-e saját felszerelést vinnie, és hányan vannak a csoportban.","Az oktató elmondja, hogy kényelmes ruha szükséges, a matracot biztosítják. Szonja hétfőnként sokáig dolgozik, ezért a csütörtöki órát választja. Az első alkalom után kellemesen elfárad. Úgy dönt, hogy egy hónapig járni fog, és utána meglátja, mennyire tetszik neki."],"words":[["mozog","двигаться"],["régóta","уже давно"],["gondolkodik valamin","размышлять о чём-либо"],["úszni jár","ходить на плавание"],["kipróbál","пробовать"],["csoportos torna","групповая гимнастика"],["ismerős","знакомый, знакомая"],["kezdő jógaóra","занятие йогой для начинающих"],["ajánl","рекомендовать"],["próbaóra","пробное занятие"],["jelentkezik","записываться"],["felszerelés","инвентарь, экипировка"],["oktató","инструктор"],["kényelmes ruha","удобная одежда"],["szükséges","необходимый"],["matrac","коврик (для йоги)"],["biztosít","предоставлять"],["alkalom","занятие, раз"],["elfárad","уставать"]],"dialogue":"– Érdeklődni szeretnék a kezdő óráról.\n – Csütörtökön hatkor van egy csoportunk.\n – Akkor is mehetek, ha még soha nem próbáltam?\n – Természetesen. Ez kezdőknek szól.\n – Mit kell vinnem magammal?\n – Kényelmes ruhát és vizet. A matracot mi adjuk.","notice":"Szabadidőközpont – mintaórarend\n\n  Hétfő 17.30: úszás, középhaladóknak. Kedd 18.00: tánc, kezdőknek. Csütörtök 18.00: jóga,\n  kezdőknek. Próbaóra: 1800 Ft. Havi négy alkalom: 6500 Ft.","grammar":"7. Nyelvtan • Грамматика: Már, még, még nem, még soha\nMár voltam ott. — Я уже там был(а). Még nem voltam ott. — Я ещё там не был(а). Még\n soha nem próbáltam. — Я никогда раньше не пробовал(а). Még mindig járok edzésre. — Я\n всё ещё хожу на тренировки. Обратите внимание: с még soha употребляется отрицание\n nem.","phrases":"Magyar                                           Русский\n\n  Még soha nem próbáltam.                          Я ещё никогда не пробовал(а).\n  Kezdők is jelentkezhetnek?                       Начинающие тоже могут записаться?\n  Mit kell vinnem magammal?                        Что мне нужно взять с собой?\n  Hányszor van egy héten?                          Сколько раз в неделю проходят занятия?\n  Szeretném kipróbálni.                            Я хотел(а) бы попробовать.","read":"1. Miért szeretne Szonja mozogni?\n\n\n 2. Mit biztosít az oktató?\n\n\n 3. Az órarendből melyik két program szól kezdőknek?","readAns":"1. Sokat ül a munkahelyén. | 2. A matracot. | 3. A tánc és a jóga.","fill":"1. ___ soha nem jártam táncolni.\n 2. Már ___ ott tegnap. (van, múlt, én)\n 3. Még ___ vettem bérletet. (tagadás)","grammarAns":"1. Még | 2. voltam | 3. nem","translate":"1. Начинающие тоже могут записаться?\n\n\n 2. Что мне нужно взять с собой?","transAns":"1. Kezdők is jelentkezhetnek? | 2. Mit kell vinnem magammal?","listen":"1. Mikor kezdődik most az óra?\n\n\n 2. Hol van a terem?","audio":"A csütörtöki kezdő torna most kivételesen fél hétkor kezdődik. A terem az első emeleten van. Az első órára nem kell bérletet venni.","listenAns":"1. Fél hétkor. | 2. Az első emeleten.","role":"A: Válassz a hirdetett órákból, de csak kedd vagy csütörtök este érsz rá. B: Mondd el az\n időpontokat és az árakat; kérdezd meg, próbálta-e már a sportot.","write":"Beszélj 6–8 mondatban egy új hobbiról, amelyet szívesen kipróbálnál. Indokold meg a\n választásodat, és mondd el, mikor lenne rá időd."},{"title":"Megéri megvenni?","ru":"Стоит ли покупать?","no":19,"paragraphs":["Nikolaj használt íróasztalt keres, mert otthon szeretne kényelmesebben dolgozni. Egy internetes hirdetésben talál egy jó méretű asztalt. Az eladó azt írja, hogy az asztal stabil, de van rajta néhány karcolás. Nikolaj üzenetben megkérdezi, hogy szétszedhető-e, és pontosan milyen magas. Az eladó elküld két új fényképet.","Nikolajnak tetszik az asztal, de a szállítást is meg kell oldania. Megkérdezi, enged-e az eladó az árból, ha ő maga viszi el. Az eladó beleegyezik egy kisebb engedménybe. Megbeszélik, hogy szombat délelőtt találkoznak. Nikolaj csak akkor fizet, amikor már személyesen megnézte az asztalt."],"words":[["használt","подержанный, бывший в употреблении"],["íróasztal","письменный стол"],["kényelmesebben","удобнее"],["internetes hirdetés","объявление в интернете"],["méret","размер"],["eladó","продавец"],["stabil","устойчивый"],["néhány","несколько"],["karcolás","царапина"],["szétszedhető","разборный"],["pontosan","точно"],["fénykép","фотография"],["szállítás","перевозка, доставка"],["megold","решать (вопрос)"],["enged az árból","уступать в цене"],["beleegyezik","соглашаться"],["engedmény","скидка, уступка"],["személyesen","лично"],["fizet","платить"]],"dialogue":"– Üdvözlöm! Érdekelne az íróasztal. Még megvan?\n – Igen, megvan.\n – Van valamilyen hibája a karcolásokon kívül?\n – Nincs, teljesen stabil.\n – Odaadná 18 ezerért, ha én viszem el?\n – Rendben, ennyiért elviheti.","notice":"Minta-hirdetés\n\n  Eladó használt íróasztal, 120 × 60 cm, magassága 75 cm. Jó állapotú, kisebb karcolásokkal.\n  Ár: 20 000 Ft, alkuképes. Személyes átvétel, szállítást nem vállalok.","grammar":"7. Nyelvtan • Грамматика: Udvarias alku: -ná/-né, -na/-ne\nOdaadná 18 ezerért? — Вы бы отдали за 18 тысяч? Megnézném az asztalt. — Я хотел(а) бы\n посмотреть стол. Engedne az árból? — Вы бы уступили в цене? A feltételes mód udvarias\n kérést fejezhet ki. При определённом объекте: megnézném az asztalt; при\n неопределённом: vennék egy asztalt.","phrases":"Magyar                                           Русский\n\n  Még megvan a hirdetett termék?                   Товар из объявления ещё в наличии?\n  Tudna küldeni egy közeli képet?                  Не могли бы Вы прислать фото крупным планом?\n  Engedne egy kicsit az árból?                     Не могли бы Вы немного снизить цену?\n  Mikor lehet átvenni?                             Когда можно забрать?\n  Megnézném személyesen.                           Я хотел(а) бы посмотреть лично.","read":"1. Miért keres íróasztalt Nikolaj?\n\n\n 2. A párbeszédben milyen hibáról kérdez Nikolaj?\n\n\n 3. A hirdetés alapján ki gondoskodik a szállításról?","readAns":"1. Otthon szeretne kényelmesebben dolgozni. | 2. Van-e más hibája a karcolásokon kívül? (A párbeszédben.) | 3. A vevő.","fill":"1. Meg___ az asztalt személyesen. (néz, én, feltételes)\n 2. Oda___ 18 ezerért? (ad, Ön, feltételes)\n 3. ___ az árból? (enged, Ön, feltételes)","grammarAns":"1. nézném | 2. adná | 3. Engedne","translate":"1. Когда можно забрать?\n\n\n 2. Не могли бы Вы немного снизить цену?","transAns":"1. Mikor lehet átvenni? | 2. Engedne egy kicsit az árból?","listen":"1. Milyen hibája van a széknek?\n\n\n 2. Mennyibe kerül?","audio":"A hirdetett szék még megvan, de az egyik lábán karcolás van. Tizenkétezer forintért elvihető. Szombat reggel vagy vasárnap délután lehet érte jönni.","listenAns":"1. Az egyik lábán karcolás van. | 2. Tizenkétezer forintba.","role":"A: Eladó egy kerékpárod 45 ezer forintért, de kopott a nyerge. B: Legfeljebb 40 ezret költenél.\n Kérdezz az állapotról és alkudjatok meg, vagy udvariasan váljatok el.","write":"Írj saját hirdetést egy használt tárgyról! Szerepeljen benne az állapot, méret vagy típus, ár,\n átvétel és egy esetleges hiba."},{"title":"Valami nincs rendben az autóval","ru":"С машиной что-то не так","no":20,"paragraphs":["Alekszej reggel furcsa hangot hallott az autójából. A hang akkor erősödött, amikor lassított. Nem tudta, mi okozza, ezért félreállt egy biztonságos helyen. Felhívott egy autószervizt, és elmondta, mit tapasztalt. A szerelő azt kérdezte, mikor jelentkezett először a probléma, és világít-e valamilyen jelzés a műszerfalon.","Alekszej nem akart kockáztatni, ezért megkérdezte, hogyan juttathatja el biztonságosan az autót a műhelybe. A szervizben először átvizsgálják a járművet. A szerelő megígéri, hogy a javítás előtt telefonon közli a várható költséget. Alekszejnek másnap szüksége lenne az autóra, ezért a javítás idejéről is érdeklődik."],"words":[["furcsa hang","странный звук"],["erősödik","усиливаться"],["lassít","сбавлять скорость"],["okoz","вызывать, быть причиной"],["félreáll","съезжать в сторону и останавливаться"],["biztonságos","безопасный"],["autószerviz","автосервис"],["tapasztal","наблюдать, замечать"],["szerelő","механик"],["jelentkezik a probléma","возникает проблема"],["világít","светиться, гореть"],["jelzés","сигнал, индикатор"],["műszerfal","приборная панель"],["kockáztat","рисковать"],["eljuttat","доставлять"],["műhely","мастерская"],["átvizsgál","осматривать, диагностировать"],["jármű","транспортное средство"],["várható költség","предполагаемые расходы"],["érdeklődik","интересоваться, узнавать"]],"dialogue":"– Jó napot! Furcsa hangot hallok, amikor fékezek.\n – Mióta jelentkezik a probléma?\n – Ma reggel óta.\n – Értem. Először meg kell vizsgálnunk az autót.\n – Felhívna, mielőtt elkezdi a javítást?\n – Természetesen. Megbeszéljük az árat és a várható határidőt.","notice":"Szervizüzenet – minta\n\n  Átvizsgálás: kedd 9.00. Várható időtartam: 1 óra. A javítás áráról az átvizsgálás után adunk\n  tájékoztatást. Kérjük, javítás előtt jelezze, ha aznap szüksége van a járműre.","grammar":"7. Nyelvtan • Грамматика: Amikor, amíg, mielőtt\nAmikor fékezek, furcsa hangot hallok. — Когда я торможу, слышу странный звук. Amíg\n vizsgálják az autót, várok. — Пока машину осматривают, я жду. Mielőtt elkezdi a javítást,\n hívjon fel! — Прежде чем начать ремонт, позвоните мне. A három kötőszó különböző\n időviszonyt fejez ki.","phrases":"Magyar                                           Русский\n\n  Nem indul az autó.                               Машина не заводится.\n  Furcsa hangot hallok.                            Я слышу странный звук.\n  Világít egy jelzés a műszerfalon.                На приборной панели горит индикатор.\n  Mennyibe kerülne a javítás?                      Сколько примерно будет стоить ремонт?\n  Mikorra készül el az autó?                       К какому времени машина будет готова?","read":"1. Mikor hallja Alekszej a furcsa hangot?\n\n\n 2. Mit ígér a szerelő a javítás előtt?\n\n\n 3. A mintaüzenet szerint meddig tart várhatóan az átvizsgálás?","readAns":"1. Amikor lassít (a párbeszédben: fékez). | 2. Telefonon közli a várható költséget. | 3. Egy óráig.","fill":"1. ___ fékezek, zajt hallok. (amikor/mielőtt)\n 2. ___ elkezdi a javítást, hívjon fel!\n 3. ___ vizsgálják az autót, itt várok.","grammarAns":"1. Amikor | 2. Mielőtt | 3. Amíg","translate":"1. Машина не заводится.\n\n\n 2. К какому времени машина будет готова?","transAns":"1. Nem indul az autó. | 2. Mikorra készül el az autó?","listen":"1. Mikor érkezik az alkatrész?\n\n\n 2. Mikorra várható a javítás vége?","audio":"Jó napot! Az autó átvizsgálása elkészült. Az alkatrész holnap reggel érkezik. A javítás várhatóan délután négyre készül el. A munka megkezdése előtt még egyeztetjük az árat.","listenAns":"1. Holnap reggel. | 2. Délután négyre.","role":"A: Az autó nem indul, délután munkába kellene menned. B: Szervizként kérdezz rá a tünetre,\n és egyeztess vizsgálati időpontot. Ne adj műszaki diagnózist.","write":"Írj üzenetet a szerelőnek: mi a probléma, mikor kezdődött, milyen időpont lenne jó, és milyen\n költségről kérsz előzetes tájékoztatást."},{"title":"Pontosan ilyet szeretnék","ru":"Я хочу именно так","no":21,"paragraphs":["Anasztázia egy fontos családi ünnepségre készül. Szeretné levágatni a haját, de nem akar nagy változást. Mutat egy fényképet a fodrásznak, és elmagyarázza, hogy oldalt csak keveset vágjon, hátul pedig maradjon hosszabb a haja. A fodrász megkérdezi, szeretne-e hajmosást is. Anasztázia igent mond, de festést nem kér.","Azt is megkérdezi, mennyi időt vesz igénybe a szolgáltatás. Délután elvisz egy nadrágot a ruhajavítóhoz, mert túl hosszú. A varrónő megméri, mennyit kell felhajtani belőle. Megbeszélik, hogy péntekre elkészül. Anasztázia elégedett, mert mindkét helyen pontosan el tudta mondani, mit szeretne."],"words":[["családi ünnepség","семейное торжество"],["készül valamire","готовиться к чему-либо"],["levágatja a haját","стричься у парикмахера"],["változás","изменение"],["fodrász","парикмахер"],["elmagyaráz","объяснять"],["oldalt","по бокам"],["hátul","сзади"],["hajmosás","мытьё головы"],["festés","окрашивание волос"],["időt vesz igénybe","занимать время"],["szolgáltatás","услуга"],["ruhajavító","ателье по ремонту одежды"],["túl hosszú","слишком длинный"],["varrónő","швея"],["megmér","измерять"],["felhajt (nadrágot)","подшивать, укорачивать брюки"],["elkészül","быть готовым"],["elégedett","довольный"]],"dialogue":"– Milyen frizurát szeretne?\n – Csak a végéből vágjon, kérem!\n – Körülbelül két centimétert?\n – Igen, de elöl maradjon hosszabb.\n – Hajmosást is kér?\n – Igen. Festést viszont nem szeretnék.","notice":"Ruhajavító – mintaárlista\n\n  Nadrág felhajtása: 2500 Ft-tól. Cipzárcsere: 3500 Ft-tól, az anyag árától függően. Átvétel:\n  hétfő–péntek 9–17. A pontos árat a ruha megtekintése után adjuk meg.","grammar":"7. Nyelvtan • Грамматика: Mennyivel? -val/-vel\nKét centiméterrel rövidebb. — На два сантиметра короче. Öt perccel később. — На пять\n минут позже. A -val/-vel суффикс в таких выражениях показывает разницу. Если слово\n заканчивается согласным, v обычно уподобляется последнему согласному: centiméter\n + vel = centiméterrel, perc + vel = perccel.","phrases":"Magyar                                           Русский\n\n  Csak egy kicsit vágjon belőle!                   Подстригите совсем немного!\n  Elöl maradjon hosszabb!                          Спереди пусть останется длиннее!\n  Két centiméterrel rövidebbre                     Я хотел(а) бы на два сантиметра короче.\n  szeretném.\n  Meg tudná javítani a cipzárt?                    Не могли бы Вы починить молнию?\n  Mikorra tudná elkészíteni?                       К какому времени Вы могли бы это сделать?","read":"1. Az olvasmány szerint milyen változást szeretne Anasztázia a haján?\n\n\n 2. Miért viszi el a nadrágot a ruhajavítóhoz?\n\n\n 3. Az árlista szerint mikor adják meg a pontos árat?","readAns":"1. Oldalt keveset vágat, hátul hosszabb hajat szeretne. | 2. Túl hosszú. | 3. A ruha megtekintése után.","fill":"1. Két centiméter___ rövidebbre kérem.\n 2. Öt perc___ később érkezem.\n 3. Egy méret___ nagyobbat szeretnék. (méret + vel)","grammarAns":"1. rel | 2. cel | 3. tel","translate":"1. Подстригите совсем немного!\n\n\n 2. К какому времени Вы могли бы это сделать?","transAns":"1. Csak egy kicsit vágjon belőle! | 2. Mikorra tudná elkészíteni?","listen":"1. Meddig vehető át ma?\n\n\n 2. Mennyibe kerül?","audio":"A nadrág elkészült, ma négyig átvehető. A javítás háromezer forintba kerül. Ha nem tud ma eljönni, holnap kilenctől nyitva vagyunk.","listenAns":"1. Négyig. | 2. Háromezer forintba.","role":"A: Kérj hajvágást vagy ruhajavítást. Írj le három pontos igényt. B: Kérdezz vissza a hosszra, az\n időpontra és a szolgáltatásra, hogy ne legyen félreértés.","write":"Találjatok ki egy szolgáltatási félreértést (túl rövid nadrág, más szín, rossz időpont).\n Játsszátok el, hogyan kértek udvariasan javítást vagy más megoldást."},{"title":"A négylábú családtag","ru":"Четвероногий член семьи","no":22,"paragraphs":["Vera nemrég örökbe fogadott egy kutyát. A kutya eleinte félt az idegenektől, de lassan megszokta az új otthonát. Vera naponta kétszer sétál vele. A hétvégén észrevette, hogy a kutya kevesebbet eszik, mint szokott, és gyakrabban fekszik le. Felhívja az állatorvosi rendelőt.","Az asszisztens megkérdezi, mióta tart a változás, iszik-e az állat, és van-e más tünete. Vera elmondja, hogy tegnap óta viselkedik másképp. Időpontot kap a vizsgálatra, és megkérdezi, mit vigyen magával. A rendelőben szeretné pontosan elmondani, mit tapasztalt. A vizsgálattal kapcsolatos kérdéseit előre felírja."],"words":[["négylábú","четвероногий"],["nemrég","недавно"],["örökbe fogad egy kutyát","брать собаку к себе в семью"],["eleinte","поначалу"],["fél az idegenektől","бояться незнакомых людей"],["megszok","привыкать"],["naponta","ежедневно"],["észrevesz","замечать"],["kevesebbet eszik","ест меньше"],["gyakrabban","чаще"],["lefekszik","ложиться"],["állatorvosi rendelő","ветеринарная клиника"],["asszisztens","ассистент"],["mióta tart?","как давно это продолжается?"],["tünet","симптом"],["viselkedik","вести себя"],["másképp","иначе"],["vizsgálat","осмотр, обследование"],["magával visz","брать с собой"],["előre felír","записывать заранее"]],"dialogue":"– Jó napot! A kutyám miatt telefonálok.\n – Mi a probléma?\n – Tegnap óta alig eszik, és nem olyan aktív, mint máskor.\n – Iszik rendesen?\n – Igen, vizet iszik.\n – Megbeszélünk egy vizsgálati időpontot.\n – Köszönöm. Vigyem az oltási könyvét is?","notice":"Minta-üzenet az állatpanziótól\n\n  A kutya péntektől vasárnapig nálunk maradhat. Kérjük, hozzon saját eledelt, és előre\n  egyeztesse velünk az oltásokkal kapcsolatos feltételeket. Érkezés pénteken 14 és 17 óra\n  között.","grammar":"7. Nyelvtan • Грамматика: Szokott + főnévi igenév\nA kutyám reggel szokott enni. — Моя собака обычно ест утром. Naponta kétszer szoktam\n sétálni vele. — Я обычно гуляю с ней два раза в день. A szoktam, szoktál, szokott alakok itt\n jelen idejű szokást fejeznek ki, bár múlt idejű alakra hasonlítanak.","phrases":"Magyar                                           Русский\n\n  Tegnap óta másképp viselkedik.                   Со вчерашнего дня он ведёт себя иначе.\n  Alig eszik.                                      Он почти не ест.\n  Mikor tudnák megvizsgálni?                       Когда Вы могли бы его осмотреть?\n  Mit vigyek magammal?                             Что мне взять с собой?\n  Saját eledelt kell hoznom?                       Мне нужно принести свой корм?","read":"1. Mióta viselkedik másképp a kutya?\n\n\n 2. Milyen változást vett észre Vera?\n\n\n 3. A mintaüzenet szerint mikor lehet megérkezni a panzióba?","readAns":"1. Tegnap óta. | 2. Kevesebbet eszik és gyakrabban fekszik le. | 3. Pénteken 14 és 17 óra között.","fill":"1. Én reggel szoktam ___. (sétál)\n 2. A kutya este szokott ___. (enni/evés)\n 3. Te mikor szokt___ hazaérni?","grammarAns":"1. sétálni | 2. enni | 3. ál","translate":"1. Он почти не ест.\n\n\n 2. Мне нужно принести свой корм?","transAns":"1. Alig eszik. | 2. Saját eledelt kell hoznom?","listen":"1. Mikor van a vizsgálat?\n\n\n 2. Mit kell magával vinnie a gazdinak?","audio":"A macskája vizsgálatára holnap délelőtt tizenegykor van időpont. Kérjük, hozza magával az oltási könyvét. Ha mégsem tud eljönni, telefonáljon a rendelőnek.","listenAns":"1. Holnap délelőtt tizenegykor. | 2. Az oltási könyvet.","role":"A: Néhány napra elutazol, és helyet keresel a kutyádnak egy állatpanzióban. B: Kérdezz rá az\n állat szokásaira, és beszéljétek meg az érkezést és a távozást.","write":"Mutass be egy valódi vagy elképzelt háziállatot 6–8 mondatban. Beszélj a szokásairól,\n gondozásáról és arról, mit kellene tudnia annak, aki vigyáz rá."},{"title":"Kevesebb szemét, több odafigyelés","ru":"Меньше мусора, больше внимания","no":23,"paragraphs":["Dániel és Olja társasházban laknak. A ház udvarán több különböző hulladékgyűjtő edény van. Olja eleinte nem tudta, melyikbe mit kell dobni, ezért elolvasta az edényeken lévő feliratokat. A helyi tájékoztatóból megtudta, hol lehet leadni a használt elemeket. Otthon külön gyűjti az üres palackokat és a papírt.","Dániel azt javasolja, hogy a bevásárláshoz vigyenek saját táskát. Így kevesebb új zacskót kell venniük. A szomszédokkal közös udvartakarítást is szerveznek. Olja szívesen részt vesz benne, mert szeretné jobban megismerni a ház lakóit. A közös munkát szombat délelőttre tervezik."],"words":[["társasház","многоквартирный дом"],["udvar","двор"],["hulladékgyűjtő edény","контейнер для отходов"],["eleinte","поначалу"],["felirat","надпись"],["helyi tájékoztató","местная информационная памятка"],["lead","сдавать"],["használt elem","использованная батарейка"],["külön gyűjt","собирать отдельно"],["üres palack","пустая бутылка"],["bevásárlás","покупка продуктов и товаров"],["saját táska","своя сумка"],["zacskó","пакет"],["udvartakarítás","уборка двора"],["szervez","организовывать"],["részt vesz","принимать участие"],["lakó","жилец"],["közös munka","совместная работа"],["tervez","планировать"]],"dialogue":"– Elnézést, hova tehetem ezt a használt elemet?\n – Van külön elemgyűjtő a boltban.\n – És a papírdobozt?\n – Nézze meg a gyűjtő feliratát!\n – Értem. A nagyobb tárgyaknak is van külön helyük?\n – Erről a helyi hulladékkezelő tud pontos tájékoztatást adni.","notice":"Társasházi hirdetmény – nyelvi minta\n\n  Szombat 9 órától udvartakarítást tartunk. Találkozó a bejáratnál. Kérjük, aki tud, hozzon\n  kesztyűt és seprűt! A lomok elszállításáról külön tájékoztatást adunk.","grammar":"7. Nyelvtan • Грамматика: Kevesebb, több, elég\nKevesebb műanyagot használunk. — Мы используем меньше пластика. Több papírt\n gyűjtünk. — Мы собираем больше бумаги. Elég egy táska. — Достаточно одной сумки.\n После слов количества существительное обычно стоит в единственном числе: több\n palack, három doboz.","phrases":"Magyar                                           Русский\n\n  Melyik edénybe kell dobni?                       В какой контейнер это нужно выбросить?\n  Hol lehet leadni a használt elemeket?            Где можно сдать использованные батарейки?\n  Hozok saját táskát.                              Я принесу свою сумку.\n  Kevesebb vizet használunk.                       Мы используем меньше воды.\n  Szívesen segítek a takarításban.                 Я с удовольствием помогу с уборкой.","read":"1. Honnan tudja meg Olja, mit hová dobjon?\n\n\n 2. Mit javasol Dániel a bevásárláshoz?\n\n\n 3. A hirdetmény szerint mit hozzanak a résztvevők?","readAns":"1. Az edényeken lévő feliratokból. | 2. Vigyenek saját táskát. | 3. Kesztyűt és seprűt, ha tudnak.","fill":"1. Több ___ gyűjtünk. (palack, tárgyeset)\n 2. Három ___ hoztam. (doboz, tárgyeset)\n 3. A cél, hogy ___ vizet használjunk. (kevés, középfok)","grammarAns":"1. palackot | 2. dobozt | 3. kevesebb","translate":"1. Где можно сдать использованные батарейки?\n\n\n 2. Мы используем меньше воды.","transAns":"1. Hol lehet leadni a használt elemeket? | 2. Kevesebb vizet használunk.","listen":"1. Melyik napon lesz a szállítás?\n\n\n 2. Meddig kell kihelyezni az edényeket?","audio":"A hétfői hulladékszállítás elmarad. A gyűjtőedényeket kedden reggel hatig kell kihelyezni. A nagyobb tárgyak elszállítása külön időpontban történik.","listenAns":"1. Kedden. | 2. Reggel hatig.","role":"Tervezzetek egy közös takarítást! Osszátok el a feladatokat, egyezzetek meg az\n eszközökben, és írjatok rövid hirdetményt. A konkrét helyi hulladékszabályokat külön\n ellenőrizzétek.","write":"Mondj öt dolgot, amivel otthon pénzt vagy energiát takaríthatsz meg. Magyarázd el, melyik a\n legegyszerűbb számodra és miért."},{"title":"Hová megy el a pénzünk?","ru":"Куда уходят наши деньги?","no":24,"paragraphs":["Kátya minden hónap végén megnézi a bankszámláját. Észrevette, hogy több olyan szolgáltatásért is fizet, amelyet ritkán használ. Van két filmes előfizetése, egy zenei alkalmazása és egy drága mobilcsomagja. Úgy dönt, hogy az egyik filmes előfizetést lemondja. A mobilcsomagját is szeretné olcsóbbra cserélni, de előbb megnézi, mennyi internetet használ havonta.","Két csomagot hasonlít össze. Az olcsóbb csomagban kevesebb adat van, de neki valószínűleg elég. Mielőtt vált, megkérdezi, van-e egyszeri díj, és mikortól lép életbe a változás. Kátya szeretne úgy takarékoskodni, hogy ne kelljen lemondania minden szórakozásról."],"words":[["bankszámla","банковский счёт"],["észrevesz","замечать"],["szolgáltatás","услуга"],["ritkán","редко"],["filmes előfizetés","подписка на фильмы"],["zenei alkalmazás","музыкальное приложение"],["mobilcsomag","тариф мобильной связи"],["lemond egy előfizetést","отменять подписку"],["olcsóbbra cserél","менять на более дешёвый вариант"],["havonta","ежемесячно"],["összehasonlít","сравнивать"],["adat (mobilinternet)","мобильный трафик"],["valószínűleg","вероятно"],["vált","переходить на другой тариф"],["egyszeri díj","разовый платёж"],["életbe lép","вступать в силу"],["takarékoskodik","экономить"],["lemond valamiről","отказываться от чего-либо"],["szórakozás","развлечение"]],"dialogue":"– Szeretném módosítani az előfizetésemet.\n – Melyik csomagra szeretne váltani?\n – Az olcsóbbra, ha elég benne az internet.\n – Megnézzük az elmúlt havi használatát?\n – Igen. Van valamilyen egyszeri díj a váltáskor?\n – A csomag feltételeiben ellenőrizzük.","notice":"Két kitalált mobilcsomag\n\n  Alap: 3900 Ft/hó, 10 GB mobilinternet. Plusz: 5900 Ft/hó, 30 GB. Kátya múlt havi\n  használata: 7 GB. A váltási és lemondási feltételekről külön kell érdeklődni.","grammar":"7. Nyelvtan • Грамматика: Annyi, amennyi; elég, túl sok\nAnnyi internetet szeretnék, amennyi elég egy hónapra. — Я хочу столько интернета,\n сколько хватит на месяц. Túl sokat fizetek. — Я плачу слишком много. Elég nekem tíz\n gigabájt. — Мне достаточно десяти гигабайт. A mennyiség összehasonlításához:\n többet/kevesebbet fizetek, mint korábban.","phrases":"Magyar                                           Русский\n\n  Mennyit fizetek havonta?                         Сколько я плачу в месяц?\n  Szeretnék olcsóbb csomagra váltani.              Я хотел(а) бы перейти на более дешёвый тариф.\n  Van egyszeri díj?                                Есть разовый платёж?\n  Mikortól lép életbe a változás?                  С какого момента изменение вступит в силу?\n  Szeretném lemondani az                           Я хотел(а) бы отменить подписку.\n  előfizetésemet.","read":"1. Miért vizsgálja át Kátya az előfizetéseit?\n\n\n 2. Mit néz meg a mobilcsomag váltása előtt?\n\n\n 3. Melyik mintaajánlat elég a múlt havi adatforgalmához?","readAns":"1. Olyan szolgáltatásokért is fizet, amelyeket ritkán használ. | 2. A havi internethasználatát és a váltás feltételeit. | 3. Az Alap csomag.","fill":"1. Túl ___ fizetek. (sok, tárgyeset)\n 2. Nekem ___ tíz gigabájt. (elég/elégnek)\n 3. Most kevesebbet fizetek, ___ tavaly.","grammarAns":"1. sokat | 2. elég | 3. mint","translate":"1. Есть разовый платёж?\n\n\n 2. Я хотел(а) бы отменить подписку.","transAns":"1. Van egyszeri díj? | 2. Szeretném lemondani az előfizetésemet.","listen":"1. Mikor indul az új csomag?\n\n\n 2. Mennyi a havidíj?","audio":"Az új csomag a következő hónap első napjától lesz aktív. A havidíj négyezer forint. Kérjük, ellenőrizze az e-mailben küldött visszaigazolást.","listenAns":"1. A következő hónap első napján. | 2. Négyezer forint.","role":"Képzeljétek el, hogy havonta 8, illetve 22 GB internetet használtok. Válasszatok külön-külön\n csomagot, majd kérdezzetek rá a feltételekre. Indokoljátok a döntést.","write":"Írj egy lemondási kérelmet vagy érdeklődő üzenetet: melyik szolgáltatásról van szó, mit\n szeretnél változtatni, és milyen költségekről kérsz tájékoztatást."},{"title":"Kár történt – mit mondjak?","ru":"Произошёл ущерб — что сказать?","no":25,"paragraphs":["Borisz este hazaérve észreveszi, hogy a konyha mennyezetén nagy nedves folt jelent meg. Felmegy a felső szomszédhoz, aki elmondja, hogy probléma volt a mosógépével. Megbeszélik, hogy értesítik a tulajdonost és a közös képviselőt. Borisz fényképet készít a foltról, és felírja, mikor vette észre a problémát.","Másnap a biztosítónál érdeklődik, mert nem tudja, hogy az ilyen károkat fedezi-e a biztosítása. Az ügyintéző elkéri a szerződés adatait, és megkéri, hogy röviden írja le a történteket. Borisz nem tudja még, pontosan mekkora a kár. Megkérdezi, milyen dokumentumokra van szükség, és mikor kaphat további tájékoztatást."],"words":[["kár","ущерб"],["hazaér","возвращаться домой"],["mennyezet","потолок"],["nedves folt","влажное пятно"],["megjelenik","появляться"],["felső szomszéd","сосед сверху"],["mosógép","стиральная машина"],["értesít","уведомлять"],["tulajdonos","собственник"],["közös képviselő","управляющий многоквартирным домом"],["fényképet készít","делать фотографию"],["biztosító","страховая компания"],["fedez (kárt)","покрывать ущерб"],["biztosítás","страховка"],["ügyintéző","сотрудник, оформляющий документы"],["szerződés adatai","данные договора"],["történtek","произошедшее"],["dokumentum","документ"],["további tájékoztatás","дополнительная информация"]],"dialogue":"– Jó napot! Kárt szeretnék bejelenteni.\n – Mi történt pontosan?\n – Tegnap este nedves foltot vettem észre a mennyezeten.\n – Készített róla fényképet?\n – Igen. Milyen dokumentumokat kell még elküldenem?\n – A szerződése alapján ellenőrizzük a szükséges adatokat.","notice":"Kitalált kárbejelentő adatlap\n\n  Helyszín: Kert utca 12. A káresemény észlelésének ideje: november 18., 19.30. Leírás:\n  nedves folt a konyha mennyezetén. Melléklet: 3 fénykép. A kár összege: még nem ismert.","grammar":"7. Nyelvtan • Грамматика: Tudom, hogy…\nNem tudom, hogy…\n Tudom, hogy tegnap történt. — Я знаю, что это произошло вчера. Nem tudom, hogy\n fedezi-e a biztosítás. — Я не знаю, покрывает ли это страховка. В косвенном вопросе\n типа «да или нет» частица -e ставится после глагола: fedezi-e, megtörtént-e. Kérdőszóval\n nincs -e: Nem tudom, mikor történt.","phrases":"Magyar                                           Русский\n\n  Kárt szeretnék bejelenteni.                      Я хотел(а) бы сообщить о страховом событии.\n  Nem tudom, mekkora a kár.                        Я не знаю, каков размер ущерба.\n  Készítettem néhány fényképet.                    Я сделал(а) несколько фотографий.\n  Milyen adatokat kell megadnom?                   Какие данные мне нужно предоставить?\n  A biztosítás fedezi ezt a kárt?                  Страховка покрывает этот ущерб?","read":"1. Mit vett észre Borisz?\n\n\n 2. Kiknek szólnak a szomszéddal?\n\n\n 3. Milyen melléklet szerepel a mintaadatlapon?","readAns":"1. Egy nedves foltot a konyha mennyezetén. | 2. A tulajdonosnak és a közös képviselőnek. | 3. Három fénykép.","fill":"1. Tudom, ___ tegnap történt.\n 2. Nem tudom, fizet___ a biztosító. (kérdőpartikula)\n 3. Nem tudom, ___ történt. (mikor/mikor-e)","grammarAns":"1. hogy | 2. -e | 3. mikor","translate":"1. Я не знаю, каков размер ущерба.\n\n\n 2. Какие данные мне нужно предоставить?","transAns":"1. Nem tudom, mekkora a kár. | 2. Milyen adatokat kell megadnom?","listen":"1. Mit kaptak meg?\n\n\n 2. Melyik adat hiányzik?","audio":"Köszönjük a bejelentését. A fényképeket megkaptuk, de a káresemény pontos ideje hiányzik. Kérjük, egészítse ki a leírást. A továbbiakról később tájékoztatjuk.","listenAns":"1. A fényképeket. | 2. A káresemény pontos ideje.","role":"A: Egy vihar után megsérült egy tárgyad. B: Ügyintézőként kérdezz rá a helyre, időre, a\n látható sérülésre és a fényképekre. Ne ígérj automatikus kártérítést.","write":"Tölts ki egy hasonló, fiktív kárbejelentőt, majd írj 5–7 mondatos, tényszerű üzenetet a\n történtekről. Különítsd el, amit láttál, attól, amit csak feltételezel."},{"title":"Beszéljük meg nyugodtan!","ru":"Давайте спокойно обсудим!","no":26,"paragraphs":["Anna hétköznap korán kel, mert reggel hatkor kezdődik a műszakja. Az új szomszédja esténként hangosan hallgat zenét. Anna néhány napig nem szól, de egyre fáradtabb. Nem akar veszekedni, ezért egyik délután becsönget a szomszédhoz. Elmondja, hogy korán kell kelnie, és a zaj miatt nehezen alszik el.","A szomszéd meglepődik, mert nem gondolta, hogy ilyen jól hallatszik a zene a másik lakásban. Bocsánatot kér, és megígéri, hogy este halkabban hallgatja. Anna megköszöni, hogy meghallgatta. Abban is megegyeznek, hogy ha újabb probléma van, nyugodtan szólnak egymásnak. Mindketten örülnek, hogy sikerült békés megoldást találni."],"words":[["hétköznap","в будние дни"],["műszak","рабочая смена"],["esténként","по вечерам"],["hangosan","громко"],["nem szól","ничего не говорит"],["egyre fáradtabb","всё более уставший"],["veszekedik","ссориться"],["becsönget","звонить в дверь"],["zaj","шум"],["elalszik","засыпать"],["meglepődik","удивляться"],["hallatszik","быть слышным"],["bocsánatot kér","извиняться"],["megígér","обещать"],["halkabban","тише"],["meghallgat","выслушивать"],["megegyezik","договариваться"],["szól egymásnak","сообщать друг другу"],["békés megoldás","мирное решение"]],"dialogue":"– Elnézést, beszélhetnénk egy percre?\n – Persze, mi történt?\n – Este elég hangos a zene, és reggel korán kelek.\n – Ne haragudjon, nem tudtam, hogy ennyire hallatszik.\n – Meg tudnánk beszélni, hogy este halkabban szóljon?\n – Természetesen. Köszönöm, hogy szólt.","notice":"Két üzenet – válassz hangnemet\n\n  A: Már megint hangos a zene! Elegem van! B: Szia! A tegnap esti zene áthallatszott a\n  lakásomba, és nehezen tudtam aludni. Meg tudnánk beszélni, hogy este halkabb legyen?","grammar":"7. Nyelvtan • Грамматика: Ellentét: de, viszont, bár\nMegértem, de nekem korán kell kelnem. — Я понимаю, но мне нужно рано вставать. Én\n szeretem a zenét, ő viszont a csendet. — Я люблю музыку, а он/она предпочитает тишину.\n Bár nem értünk mindenben egyet, meg tudjuk beszélni. — Хотя мы не во всём согласны,\n мы можем это обсудить.","phrases":"Magyar                                           Русский\n\n  Nem szeretnék veszekedni.                        Я не хочу ссориться.\n  Megértem az álláspontját.                        Я понимаю Вашу точку зрения.\n  Ezzel nem teljesen értek egyet.                  Я не совсем с этим согласен (согласна).\n  Találjunk közös megoldást!                       Давайте найдём общее решение!\n  Köszönöm, hogy meghallgatott.                    Спасибо, что выслушали меня.","read":"1. Mi zavarja Annát?\n\n\n 2. Mit szeretne elérni Anna a beszélgetéssel?\n\n\n 3. Melyik mintaüzenet kér együttműködést konkrét javaslattal?","readAns":"1. Az esti hangos zene, ami miatt nehezen alszik el. | 2. Békés megoldást szeretne találni. | 3. A B üzenet.","fill":"1. Megértem, ___ nekem pihennem kell. (de/ezért)\n 2. Én reggel dolgozom, ő ___ este. (viszont/mert)\n 3. ___ nem értünk egyet, beszélhetünk róla. (bár/hogy)","grammarAns":"1. de | 2. viszont | 3. Bár","translate":"1. Я не хочу ссориться.\n\n\n 2. Давайте найдём общее решение!","transAns":"1. Nem szeretnék veszekedni. | 2. Találjunk közös megoldást!","listen":"1. Miért kér bocsánatot?\n\n\n 2. Mit ígér a mai estére?","audio":"Szia! Ne haragudj a tegnapi zajért. Ma vendégeim lesznek, de este tíz előtt befejezzük a zenélést. Ha mégis zavar valami, kérlek, szólj!","listenAns":"1. A tegnapi zajért. | 2. Tíz előtt befejezik a zenélést.","role":"A: A lakótársad gyakran használja a közös konyhát, de nem takarít el maga után. B: Sok a\n munkád, és elfelejted. Mindketten mondjatok el egy problémát és ajánljatok egy\n kompromisszumot.","write":"Alakítsd át az A mintaüzenetet udvarias üzenetté úgy, hogy szerepeljen benne a konkrét\n probléma, annak következménye és egy teljesíthető kérés. Utána írj választ a szomszéd\n nevében."}];
const $=id=>document.getElementById(id), E=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;};
let active=0,quizToken=0, utterance=null;const select=$("lesson"), host=$("content");
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const saved=Number(store.get("hu-ru-new-life-lesson"));if(Number.isInteger(saved)&&saved>=0&&saved<DATA.length)active=saved;
DATA.forEach((d,i)=>{const o=E("option",(i+1)+". "+d.ru+" / "+d.title);o.value=i;select.append(o)});
function panel(title){const p=E("section",null,"panel");p.append(E("h2",title));host.append(p);return p}
function details(p,title,text){const d=E("details");d.append(E("summary",title),E("pre",text));p.append(d);return d}
function task(p,title,text,key,solution){p.append(E("h3",title),E("pre",text));const area=E("textarea");area.setAttribute("aria-label",title);area.placeholder="Напишите ответ по-венгерски";const id="hu-ru-new-life-"+active+"-"+key;area.value=store.get(id)||"";area.addEventListener("input",()=>store.set(id,area.value));p.append(area);if(solution)details(p,"Проверить по образцу · Mintamegoldás",solution);else p.append(E("p","Самостоятельная работа: обсудите ответ с преподавателем.","note"));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(p,d){
 const title=E("h3","Карточки и проверка слов · Szókártyák és szókikérdezés");
 const prefs=E("div",null,"vocab-controls");
 function field(label,values){const wrap=E("label",label),s=E("select");for(const [v,t] of values){const o=E("option",t);o.value=v;s.append(o)}wrap.append(s);prefs.append(wrap);return s}
 const mode=field("Режим",[["cards","Карточки"],["choice","Тест: выбор ответа"],["write","Тест: напишите по-венгерски"]]);
 const direction=field("Направление",[["hu","Венгерский → русский"],["ru","Русский → венгерский"],["mix","В обоих направлениях"]]);
 const filter=field("Слова",[["all","Все слова урока"],["new","Новые, ещё не проверенные"],["missed","Трудные слова"]]);
 const key="hu-ru-new-life-vocab-v1-"+d.no;
 let ratings={};try{ratings=JSON.parse(store.get(key)||"{}")||{}}catch{}
 const overview=E("p"),begin=E("button","Начать","primary"),out=E("div");
 overview.setAttribute("aria-live","polite");p.append(title,overview,prefs,begin,out);
 function stats(){const known=d.words.filter(w=>ratings[w[0]]==="known").length,missed=d.words.filter(w=>ratings[w[0]]==="missed").length;overview.textContent="Всего: "+d.words.length+" · Знаю: "+known+" · Повторить: "+missed+" · Новые: "+(d.words.length-known-missed)}
 function rate(w,ok){ratings[w[0]]=ok?"known":"missed";store.set(key,JSON.stringify(ratings));stats()}
 function sync(){direction.disabled=mode.value==="write"}mode.onchange=sync;sync();stats();
 const norm=s=>s.normalize("NFC").trim().toLocaleLowerCase("hu-HU").replace(/\s+/g," ").replace(/[.!?…]+$/u,"");
 function run(items,chosenMode,chosenDir){const token=++quizToken;let ix=0,correct=0,wrong=[];const pool=shuffle(items);
 function step(){
  if(token!==quizToken)return;out.replaceChildren();
  if(ix===pool.length){out.append(E("p","Результат: "+correct+" / "+pool.length,"note"));if(wrong.length){const again=E("button","Повторить трудные слова","primary");again.onclick=()=>run(wrong,chosenMode,chosenDir);out.append(again)}return}
  const w=pool[ix],a=chosenMode==="write"||chosenDir==="ru"?1:chosenDir==="mix"?ix%2:0,b=1-a;
  out.append(E("p",(ix+1)+" / "+pool.length));
  let locked=false;
  function record(ok){if(locked)return false;locked=true;if(ok)correct++;else wrong.push(w);rate(w,ok);return true}
  function advance(){ix++;step()}
  if(chosenMode==="cards"){
   const card=E("button",null,"vocab-card"),tag=E("small",a===0?"MAGYAR":"РУССКИЙ"),word=E("strong",w[a]),hint=E("span","Нажмите, чтобы перевернуть");card.append(tag,word,hint);card.setAttribute("aria-expanded","false");out.append(card);
   const row=E("div",null,"row"),no=E("button","× Не знаю"),yes=E("button","✓ Знаю","primary");row.append(no,yes);row.hidden=true;out.append(row);
   let flipped=false;card.onclick=()=>{flipped=!flipped;tag.textContent=(flipped?b:a)===0?"MAGYAR":"РУССКИЙ";word.textContent=w[flipped?b:a];hint.textContent=flipped?"Нажмите, чтобы вернуться":"Нажмите, чтобы перевернуть";card.setAttribute("aria-expanded",String(flipped));if(flipped)row.hidden=false};
   no.onclick=()=>{if(record(false))advance()};yes.onclick=()=>{if(record(true))advance()};return
  }
  out.append(E("h3",w[a]));const feedback=E("p");feedback.setAttribute("role","status");const next=E("button","Следующий вопрос");next.hidden=true;next.onclick=advance;
  function result(ok){if(!record(ok))return;feedback.textContent=ok?"Верно!":"Правильный ответ: "+w[b];feedback.className=ok?"good":"bad";next.hidden=false;next.focus()}
  if(chosenMode==="write"){
   const form=E("form",null,"row"),input=E("input"),check=E("button","Проверить","primary");input.type="text";input.autocomplete="off";input.spellcheck=false;input.placeholder="Введите венгерское слово";input.setAttribute("aria-label","Ответ по-венгерски");check.type="submit";form.append(input,check);form.onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;const ok=norm(input.value)===norm(w[b]);input.disabled=true;check.disabled=true;result(ok)};out.append(form,feedback,next);input.focus();return
  }
  const row=E("div",null,"row"),alternatives=shuffle([...new Set(d.words.filter(z=>z[a]!==w[a]&&z[b]!==w[b]).map(z=>z[b]))]).slice(0,3);
  for(const option of shuffle([w[b],...alternatives])){const btn=E("button",option);btn.onclick=()=>{[...row.children].forEach(z=>z.disabled=true);result(option===w[b])};row.append(btn)}out.append(row,feedback,next)
 }step()}
