<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tanfolyami gyakorlatok – Magyar–orosz Tanulóműhely</title><style>:root{font-family:system-ui,sans-serif;background:#f3f7f5;color:#173d3c}*{box-sizing:border-box}body{margin:0}header{background:#174a45;color:white;padding:22px max(18px,calc((100vw - 920px)/2))}header a{color:white}main{max-width:920px;margin:auto;padding:18px}.panel{background:white;border:1px solid #d8e5de;padding:22px;border-radius:15px;margin:14px 0}select,button,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #b7cbc2}button{cursor:pointer;background:#e7f2eb;color:#18594d}button.primary{background:#176b59;color:white}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.line{border-left:3px solid #90baa7;background:#f2f8f4;padding:12px;margin:8px 0}.q{border-top:1px solid #e2eae6;padding:15px 0}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button.selected{background:#176b59;color:white}.note{background:#edf5fc;border-radius:9px;padding:12px}.hidden{display:none}.muted{color:#55716a}.result{font-weight:700}textarea{width:100%;min-height:85px}@media(max-width:600px){main{padding:9px}.panel{padding:13px}}</style><script src="speech.js"></script></head><body><header><a href="index.html">← Magyar–orosz Tanulóműhely</a><h1>Tanfolyami gyakorlatok</h1><p>Saját óravázlatok alapján · A1–B2 · Olvasás, hallás, nyelvtan és önálló beszéd</p></header><main><section class="panel"><div class="row"><label for="level">Szint</label><select id="level"><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select><label for="lesson">Lecke</label><select id="lesson"></select></div><p id="ru" class="muted"></p><div class="row"><button id="reading" class="primary">📖 Olvasás</button><button id="listening">🎧 Hallás után</button><button id="play">🔊 Hallgasd meg magyarul!</button><button id="slow">Lassú beszéd: ki</button><button id="stop">Leállítás</button></div><p id="speech" role="status" class="muted"></p></section><section class="panel"><h2 id="title"></h2><div id="passage" class="line"></div><button id="reveal" class="hidden">Átirat megtekintése</button><p id="grammar" class="note"></p></section><section class="panel"><h2>Szövegértés és nyelvtan</h2><div id="questions"></div><button id="check" class="primary">Válaszok ellenőrzése</button><button id="reset">Újrakezdés</button><p id="result" class="result" role="status"></p></section></main><script>const LESSONS=[["A1","Bemutatkozás és nyelvek","Olga orosz. Budapesten él, és magyarul tanul. Egy kicsit beszél magyarul. Minden nap új szavakat gyakorol. A barátja magyarul és angolul beszél.","Языки и знакомство","Én beszélek, te beszélsz, ő beszél.",[["Hol él Olga?","Budapesten","Szegeden","Moszkvában"],["Mit tanul Olga?","Magyarul beszélni","Franciául beszélni","Németül írni"],["Milyen gyakran gyakorol?","Minden nap","Csak hétfőn","Soha"],["Én magyarul ___ .","beszélek","beszélsz","beszél"]],"Milyen nyelveken beszélsz?"],["A1","Mi van a táskában?","Anna táskájában van egy telefon, egy toll és egy könyv. A pénztárcája is a táskában van. A kulcsa nincs ott. A kulcs az asztalon van.","Что в сумке?","A táskában, az asztalon: hol? Van és nincs.",[["Mi van a táskában?","Telefon","Szék","Kerékpár"],["Hol van a kulcs?","Az asztalon","A táskában","Az ágy alatt"],["Hol van a pénztárca?","A táskában","A szekrényben","A parkban"],["A telefon a táská___ van.","ban","ben","ba"]],"Mi van a táskádban?"],["A1","A nappaliban","A nappaliban van egy kanapé és egy asztal. A lámpa az asztalon van. A szőnyeg az asztal alatt van. A könyvek a polcon vannak. A konyha a nappali mellett van.","Комната и мебель","Alatt, mellett, felett, -on/-en/-ön: helyviszonyok.",[["Hol van a lámpa?","Az asztalon","A kanapé alatt","A konyhában"],["Mi van az asztal alatt?","A szőnyeg","A polc","A könyv"],["Hol vannak a könyvek?","A polcon","A padon","A táskában"],["A konyha a nappali ___ van.","mellett","mellé","mellől"]],"Hol van három tárgy a szobádban?"],["A2","A vasútállomáson","Borisz Szegedre utazik. A pénztárnál oda-vissza jegyet kér. A vonat tíz percet késik, ezért később indul. Borisz a kijelzőn ellenőrzi, melyik vágányról indul a vonat.","На вокзале","Oda-vissza jegy, késik, indul: utazási kifejezések.",[["Hová utazik Borisz?","Szegedre","Pécsre","Győrbe"],["Milyen jegyet kér?","Oda-vissza","Csak oda","Bérletet"],["Mennyit késik a vonat?","Tíz percet","Egy órát","Nem késik"],["Borisz ___ a vágányt.","ellenőrzi","ellenőrzök","ellenőrzöl"]],"Hogyan érdeklődnél egy késő vonatról?"],["A2","Időpontot szeretnék kérni","Marina felhívja a rendelőt, mert időpontot szeretne kérni. Pénteken délelőtt dolgozik, ezért inkább délután ér rá. A recepciós hétfőn három órára tud időpontot adni. Marina elfogadja.","Запись на приём","Szeretnék + főnévi igenév; hétfőn három órára.",[["Miért telefonál Marina?","Időpontot kér","Jegyet vesz","Csomagot ad fel"],["Mikor dolgozik pénteken?","Délelőtt","Délután","Este"],["Mikorra kap időpontot?","Hétfő három órára","Kedd kilencre","Péntek délre"],["Időpontot ___ kérni.","szeretnék","szeretnél","szeret"]],"Kérj udvariasan időpontot!"],["A2","Kérek vagy kérem?","A piacon vagyok. Kérek egy almát. Az eladó két almát mutat. A piros almát kérem. A barátom egy levest főz, én pedig a kedvenc levesemet főzöm.","Определённое и неопределённое спряжение","Határozatlan tárgy: kérek egy almát. Határozott tárgy: a piros almát kérem.",[["Melyik a helyes alak?","Kérek egy almát.","Kérem egy almát.","Kérsz egy almát."],["Melyik helyes?","A piros almát kérem.","A piros almát kérek.","A piros almát kérsz."],["A levest ___ .","főzöm","főzök","főzöl"],["Pétert ___ .","látom","látok","látsz"]],"Mondj egy mondatot a kérek és egyet a kérem igével!"],["B1","Új kolléga az irodában","Szergej hétfőn kezdett az új munkahelyén. Korábban egy kisebb cégnél dolgozott, most viszont egy nemzetközi csapat tagja. A munkája változatos, de még sok új programot kell megtanulnia. A kollégái szívesen segítenek neki.","Новая работа","Korábban ... dolgozott; most ... dolgozik. Múlt és jelen idő.",[["Mikor kezdett Szergej?","Hétfőn","Szombaton","Pénteken"],["Hol dolgozott korábban?","Egy kisebb cégnél","Egy kórházban","Egy boltban"],["Mi nehéz az új munkában?","Új programokat kell megtanulnia","Nem találja az épületet","Nincs számítógépe"],["Korábban egy cégnél ___ .","dolgozott","dolgozik","dolgozni"]],"Milyen lenne számodra az ideális munkahely?"],["B1","Beszéljünk a nyelvtanulásról","Dóra már két éve tanul magyarul. Az elején sokszor félt megszólalni, mert nem akart hibázni. Ma már beszélget a kollégáival. Azt tanácsolja a kezdőknek, hogy minden nap gyakoroljanak, és ne féljenek kérdezni.","Как учить языки?","Azt tanácsolja, hogy ... : felszólító mód mellékmondatban.",[["Mióta tanul Dóra magyarul?","Két éve","Két hónapja","Egy hete"],["Mitől félt régebben?","A hibázástól","Az utazástól","A vásárlástól"],["Kikkel beszélget ma már?","A kollégáival","Csak a tanárával","Csak oroszul"],["Azt tanácsolja, hogy minden nap ___ .","gyakoroljanak","gyakoroltak","gyakorolnak tegnap"]],"Mit tanácsolnál egy magyarul tanuló ismerősödnek?"],["B2","Pályaváltás és tanulás","Márta hosszú ideje ugyanannál a vállalatnál dolgozik, de új szakmát szeretne tanulni. Bár a biztos állás feladása kockázatos lehet, úgy érzi, hogy a fejlődéshez változtatnia kell. Először egy esti tanfolyamot végezne el, hogy kipróbálja, valóban érdekli-e az új terület.","Смена профессии","Bár..., mégis...; feltételes mód és célhatározói mellékmondat.",[["Miért gondolkodik Márta váltáson?","Fejlődni szeretne","Elköltözik","Megszűnik a vállalat"],["Mi jelenti a kockázatot?","A biztos állás feladása","Az esti tanfolyam hossza","A kollégák száma"],["Mit tenne először?","Esti tanfolyamot végezne el","Azonnal felmondana","Vállalatot alapítana"],["Először egy tanfolyamot ___ el.","végezne","végez","végzett"]],"Mikor tartanád indokoltnak a pályaváltást?"],["B2","Turizmus és helyi élet","Egy népszerű magyar városban egyre több turista fordul meg. A helyi vállalkozások örülnek a növekvő forgalomnak, ugyanakkor a lakók a zajra és a dráguló lakbérekre panaszkodnak. Az önkormányzat olyan megoldást keres, amely egyszerre támogatja a turizmust és védi a lakók érdekeit.","Туризм и местные жители","Ugyanakkor; amely: érvelés és vonatkozó mellékmondat.",[["Kik örülnek a növekvő forgalomnak?","A vállalkozások","Csak a lakók","A turisták ellenzői"],["Mi zavarja a lakókat?","A zaj és a lakbérek","A múzeumok nyitvatartása","A buszjegyek színe"],["Milyen megoldást keresnek?","Kiegyensúlyozottat","A teljes tiltást","A boltok bezárását"],["Olyan megoldás kell, ___ mindkét félnek megfelelő.","amely","amikor","mert"]],"Hogyan lehet összeegyeztetni a turizmust a helyiek érdekeivel?"]];(()=>{const $=x=>document.getElementById(x);let index=0,mode="read",answers={},correct={},checked=false,slow=false;let best={};try{best=JSON.parse(localStorage.getItem("hu-ru-course-drive-1")||"{}")}catch{};function stop(){if("speechSynthesis"in window)TanuloTTS.cancel();$("speech").textContent=""}function speech(){if(!("speechSynthesis"in window)){$("speech").textContent="A felolvasás nem támogatott ezen a készüléken.";return}stop();const u=new SpeechSynthesisUtterance(LESSONS[index][2]);u.lang="hu-HU";u.rate=slow?.7:.88;$("speech").textContent="Magyar felolvasás";u.onend=()=>{$("speech").textContent=""};TanuloTTS.speak(u)}function list(){let chosen=$("level").value;const opts=LESSONS.map((l,i)=>({l,i})).filter(x=>x.l[0]===chosen);$("lesson").replaceChildren();opts.forEach(({l,i})=>{const o=document.createElement("option");o.value=i;o.textContent=l[1];$("lesson").append(o)});index=opts[0].i;render()}function showText(force=false){$("passage").textContent=mode==="listen"&&!force?"Hallgasd meg a szöveget magyarul! Az átirat a válaszok ellenőrzése után jelenik meg.":LESSONS[index][2]}function render(){stop();checked=false;answers={};correct={};const l=LESSONS[index];$("title").textContent=l[1];$("ru").textContent=l[3];$("grammar").textContent="Nyelvtani segítség: "+l[4];$("result").textContent="";$("reveal").classList.add("hidden");$("check").disabled=false;showText();$("questions").replaceChildren();l[5].forEach((q,j)=>{const d=document.createElement("div");d.className="q";const h=document.createElement("h3");h.textContent=(j+1)+". "+q[0];const c=document.createElement("div");c.className="choices";q.slice(1).map((a,k)=>({a,k})).sort(()=>Math.random()-.5).forEach(({a,k},position)=>{if(k===0)correct[j]=position;const b=document.createElement("button");b.textContent=a;b.onclick=()=>{if(checked)return;answers[j]=position;[...c.children].forEach((v,n)=>v.classList.toggle("selected",n===position))};c.append(b)});d.append(h,c);$("questions").append(d)})}function check(){if(checked)return;checked=true;const l=LESSONS[index];let score=0;const wrong=[];l[5].forEach((q,j)=>{if(answers[j]===correct[j])score++;else wrong.push((j+1)+". "+q[1])});$("result").textContent="Eredmény: "+score+"/"+l[5].length+". "+(wrong.length?"Helyes megoldások: "+wrong.join(" | "):"Minden válasz helyes!");$("check").disabled=true;if(mode==="listen")$("reveal").classList.remove("hidden");if(score>(best[index]||0)){best[index]=score;try{localStorage.setItem("hu-ru-course-drive-1",JSON.stringify(best))}catch{}}} $("level").onchange=list;$("lesson").onchange=e=>{index=+e.target.value;render()};$("reading").onclick=()=>{mode="read";$("reading").className="primary";$("listening").className="";render()};$("listening").onclick=()=>{mode="listen";$("listening").className="primary";$("reading").className="";render()};$("play").onclick=speech;$("slow").onclick=()=>{slow=!slow;$("slow").textContent="Lassú beszéd: "+(slow?"be":"ki")};$("stop").onclick=stop;$("reveal").onclick=()=>{showText(true);$("reveal").classList.add("hidden")};$("check").onclick=check;$("reset").onclick=render;window.addEventListener("pagehide",stop);const initial=new URLSearchParams(location.search).get("level");if(["A1","A2","B1","B2"].includes(initial))$("level").value=initial;list()})();</script></body></html>
